services:
  - type: web
    name: hiring-platform
    runtime: node
    startCommand: npm start
    buildCommand: npm install && npx prisma db push --skip-generate && npx prisma generate && npm run build
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          name: hiring-platform
          property: host
          prefix: "https://"
      - key: NEXTAUTH_SECRET
        generateValue: true
  - type: postgres
    name: postgres
    version: "15"
    plan: free